services:
    backend:
        container_name: bisonbar_backend
        hostname: bisonbar.docker.dev
        build:
            context: .
            dockerfile: docker/backend.dockerfile
        volumes:
            - ./:/var/www
        environment:
            - VIRTUAL_HOST=bisonbar.docker.dev
            - VIRTUAL_PROTO=https
            - VIRTUAL_PORT=443
        networks:
            - default
            - local-dev
        ports:
            - "9060:9060"
    frontend:
        container_name: bisonbar_frontend
        image: node:current-alpine
        volumes:
            - ./:/var/www/public
        build:
            dockerfile: docker/frontend.dockerfile
        working_dir: /var/www/public
        ports:
            - "7060:7060"
        networks:
            - default
            - local-dev
    mariadb:
        hostname: bisonbar_mariadb.docker.dev
        container_name: bisonbar_mariadb
        image: "mariadb:latest"
        ports:
            - "8070:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "secret"
            MYSQL_DATABASE: "development"
            MYSQL_USER: "development"
            MYSQL_PASSWORD: "secret"
        networks:
            - default
            - local-dev
    mariadbtest:
        hostname: bisonbar_mariadb.docker.test
        container_name: bisonbar_mariadb_test
        image: "mariadb:latest"
        ports:
            - "8170:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "secret"
            MYSQL_DATABASE: "test"
            MYSQL_USER: "test"
            MYSQL_PASSWORD: "secret"
        networks:
            - default
            - local-dev
networks:
    local-dev:
        external: true
